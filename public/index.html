<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - RoomSync</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://alcdn.msauth.net/browser/2.37.0/js/msal-browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f3f4f6; /* Fallback */
            background-color: var(--bg-main, #f3f4f6);
            margin: 0;
            font-family: 'Poppins', sans-serif;
        }
        .welcome-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05), 0 10px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .welcome-card i.lucide-layers {
            width: 64px;
            height: 64px;
            color: #6366f1; /* Fallback */
            color: var(--primary, #6366f1);
            margin-bottom: 16px;
        }
        .welcome-card h1 {
            margin: 0 0 10px;
            color: #1e293b; /* Fallback */
            color: var(--text-dark, #1e293b);
            font-size: 24px;
        }
        .welcome-card p {
            color: #64748b; /* Fallback */
            color: var(--text-muted, #64748b);
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .btn-primary {
            width: 100%;
            justify-content: center;
            padding: 12px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <i data-lucide="layers"></i>
        <h1>Welcome to RoomSync</h1>
        <p>Sign in with your Microsoft 365 account to book and manage meeting rooms.</p>
        
        <button class="btn-primary" id="login-btn" onclick="signIn()">
            <i data-lucide="log-in"></i> Sign In with Microsoft 365
        </button>
    </div>

    <!-- Global Loader Overlay -->
    <div id="global-loader" class="global-loader-overlay">
        <div class="spinner"></div>
        <h3 style="color: #1e293b; font-size: 18px;">Signing you in...</h3>
        <p style="color: #64748b; font-size: 14px;">Please wait.</p>
    </div>

    <script>
        lucide.createIcons();

        let myMSALObj;
        
        async function initAuth() {
            try {
                const res = await fetch('/api/config');
                const configData = await res.json();
                const msalConfig = {
                    auth: {
                        clientId: configData.clientId,
                        authority: `https://login.microsoftonline.com/${configData.tenantId}`,
                        redirectUri: window.location.origin
                    }
                };
                myMSALObj = new msal.PublicClientApplication(msalConfig);
                await myMSALObj.initialize();
                
                const currentAccounts = myMSALObj.getAllAccounts();
                if (currentAccounts.length > 0) {
                    // Already logged in, redirect to dashboard
                    window.location.href = '/dashboard.html';
                }
            } catch (e) {
                console.error("Auth init error:", e);
            }
        }

        initAuth();

        async function signIn() {
            try {
                const loginResponse = await myMSALObj.loginPopup({ scopes: ["User.Read"] });
                if (loginResponse.account) {
                    // Show loader and delay for 5 seconds
                    document.getElementById('global-loader').classList.add('show');
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 5000);
                }
            } catch (error) {
                console.error(error);
            }
        }
    </script>
</body>
</html>
