<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Dashboard</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@1.27.0"></script>
    <!-- FullCalendar Premium -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar-scheduler@6.1.15/index.global.min.js'></script>
    <script src="https://alcdn.msauth.net/browser/2.37.0/js/msal-browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="toast-container"></div>

<!-- Global Loader Overlay -->
<div id="global-loader" class="global-loader-overlay">
    <div class="spinner"></div>
    <h3 style="color: #1e293b; font-size: 18px;">Signing you out...</h3>
    <p style="color: #64748b; font-size: 14px;">Please wait.</p>
</div>

<!-- Event Detail Modal -->
<div id="eventModal" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-header">
            <h3 class="modal-title">Meeting Details</h3>
            <i data-lucide="x" class="modal-close" onclick="closeEventModal()"></i>
        </div>
        <div class="modal-body">
            <div>
                <strong>Date</strong>
                <span id="modalDate"></span>
            </div>
            <div>
                <strong>Time</strong>
                <span id="modalTime"></span>
            </div>
            <div>
                <strong>Meeting Subject</strong>
                <span id="modalSubject"></span>
            </div>
            <div>
                <strong>Room</strong>
                <span id="modalRoom"></span>
            </div>
            <div>
                <strong>Attendees</strong>
                <span id="modalAttendees"></span>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel-meeting" id="btnCancelMeeting">Cancel Meeting</button>
        </div>
    </div>
</div>



<!-- Address Book Modal -->
<div id="addressBookModal" class="modal-overlay">
    <div class="modal-card" style="max-width: 700px; width: 90%;">
        <div class="modal-header">
            <h3 class="modal-title">Address Book</h3>
            <i data-lucide="x" class="modal-close" onclick="closeAddressBook()"></i>
        </div>
        <div class="modal-body" style="max-height: 400px; overflow-y: auto; padding: 0; -webkit-overflow-scrolling: touch; transform: translate3d(0,0,0); will-change: transform;">
            <div style="padding: 8px 10px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 10; display: flex; justify-content: flex-end;">
                <input type="text" id="addressBookSearch" placeholder="Search name or email..." style="width: 220px; padding: 6px 10px; font-size: 12px; border: 1px solid #cbd5e1; border-radius: 4px; font-family: inherit;" onkeyup="filterAddressBook()">
            </div>
            <div id="addressBookLoading" style="padding: 20px; text-align: center;">Loading...</div>
            <table id="addressBookTable" style="width: 100%; text-align: left; border-collapse: collapse; display: none; font-size: 13px;">
                <thead style="background: #f8fafc; position: sticky; top: 51px;">
                    <tr>
                        <th style="padding: 10px; border-bottom: 1px solid #e2e8f0;">Name & Email</th>
                        <th style="padding: 10px; border-bottom: 1px solid #e2e8f0;">Title / Dept</th>
                        <th style="padding: 10px; border-bottom: 1px solid #e2e8f0;">Status</th>
                        <th style="padding: 10px; border-bottom: 1px solid #e2e8f0; text-align: center;">Add</th>
                    </tr>
                </thead>
                <tbody id="addressBookList"></tbody>
            </table>
            <div id="addressBookPagination" style="padding: 10px; display: none; justify-content: space-between; align-items: center; background: #f8fafc; border-top: 1px solid #e2e8f0; font-size: 13px;">
                <button type="button" id="btnPrevPage" onclick="changeAddressBookPage(-1)" style="padding: 4px 8px; cursor: pointer; border: 1px solid #cbd5e1; background: white; border-radius: 4px;">Previous</button>
                <span id="addressBookPageInfo">Page 1 / 1</span>
                <button type="button" id="btnNextPage" onclick="changeAddressBookPage(1)" style="padding: 4px 8px; cursor: pointer; border: 1px solid #cbd5e1; background: white; border-radius: 4px;">Next</button>
            </div>
        </div>
    </div>
</div>

<div class="dashboard">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">
            <i data-lucide="layers"></i> RoomSync
        </div>
        
        <div id="auth-section" class="booking-card" style="margin-bottom: 4px; display: flex; flex-direction: column; gap: 8px; padding: 12px;">
            <div id="auth-user-info" style="font-size:14px; font-weight: 500; text-align: center; word-break: break-word;">Loading...</div>
            <button class="btn-primary" id="logout-btn" onclick="signOut()" style="background:#ef4444; border-color:#ef4444;">
                <i data-lucide="log-out"></i> Sign Out
            </button>
        </div>
        
        <div class="booking-card">
            <h3><i data-lucide="calendar-plus"></i> New Booking</h3>
            <div class="form-group">
                <label>Select Room</label>
                <select id="room-select"></select>
            </div>
            <div class="form-group" style="position: relative;">
                <label>Requester</label>
                <input type="email" id="organizer" placeholder="name@citarasakuliner.com" autocomplete="off" disabled>
                <div id="autocomplete-list" class="autocomplete-items"></div>
            </div>
            <div class="form-group">
                <label>Meeting Subject</label>
                <input type="text" id="subject" placeholder="Weekly Sync">
            </div>
            <div class="form-group" style="position: relative;">
                <label style="display: flex; justify-content: space-between; align-items: center;">
                    Invite Attendees
                    <button type="button" onclick="openAddressBook()" style="background: #e2e8f0; border: none; padding: 2px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; color: #475569; display: flex; align-items: center; gap: 4px;"><i data-lucide="users" style="width: 12px; height: 12px;"></i> Address Book</button>
                </label>
                <input type="text" id="attendees" placeholder="email@citarasakuliner.com" autocomplete="off">
                <div id="attendees-autocomplete-list" class="autocomplete-items"></div>
            </div>
            <div class="form-group">
                <label>Date</label>
                <input type="date" id="date">
            </div>
            <div style="display: flex; gap: 12px;">
                <div class="form-group" style="flex: 1;">
                    <label>Start Time</label>
                    <input type="time" id="start">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>End Time</label>
                    <input type="time" id="end">
                </div>
            </div>
            <div class="form-group" style="margin-top: 4px; margin-bottom: 8px;">
                <div id="teams-toggle" class="chip-toggle" title="Teams Meeting is Off" onclick="this.classList.toggle('active'); this.title = this.classList.contains('active') ? 'Teams Meeting is On' : 'Teams Meeting is Off';">
                    <i data-lucide="video" style="width: 16px; height: 16px;"></i> Teams Meeting
                </div>
            </div>
            <button class="btn-primary" id="book-btn" onclick="bookRoom()">
                <i data-lucide="check-circle"></i> Book Now
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="main-wrapper">

        <main class="content">
            <!-- Stats -->
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-icon" style="background: rgba(139, 92, 246, 0.1); color: #8b5cf6;"><i data-lucide="door-open"></i></div>
                    <div class="stat-info">
                        <h4>Total Rooms</h4>
                        <p id="stat-rooms">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: rgba(16, 185, 129, 0.1); color: #10b981;"><i data-lucide="calendar-check"></i></div>
                    <div class="stat-info">
                        <h4>Status</h4>
                        <p>Active</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: rgba(59, 130, 246, 0.1); color: #3b82f6;"><i data-lucide="users"></i></div>
                    <div class="stat-info">
                        <h4>Meetings in View</h4>
                        <p id="today-meetings-count">0</p>
                    </div>
                </div>
            </div>

            <!-- Calendar -->
            <div class="calendar-wrapper">
                <div id="calendar"></div>
            </div>
            
            <!-- Active Logs -->
            <div class="active-logs-wrapper" id="active-logs-wrapper" style="display: none;">
                <h4><i data-lucide="activity"></i> Current Room Status</h4>
                <div id="active-logs" class="logs-grid"></div>
            </div>
        </main>
    </div>
</div>

<script>lucide.createIcons();</script>
<script src="/js/toast.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/booking.js"></script>
<script src="/js/autocomplete.js"></script>
<script src="/js/addressbook.js"></script>
<script src="/js/calendar.js"></script>
</body>
</html>
